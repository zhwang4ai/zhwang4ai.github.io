short_bio_text_justify: false
short_bio: >-
  <p>
    I'm a Ph.D. student at the Institute for Artificial Intelligence, Peking University (PKU), advised by <a href="https://scholar.google.com/citations?user=KVzR1XEAAAAJ" target="_blank">Prof. Yitao Liang</a>. I also collaborate closely with <a href="https://scholar.google.com/citations?user=KVzR1XEAAAAJ" target="_blank">Dr. Xiaojian Ma</a> and <a href="https://scholar.google.com/citations?user=KVzR1XEAAAAJ" target="_blank">Prof. Anji Liu</a>. Before joining PKU, I earned my MSc and BA degrees in Control Science and Technology from Beijing Institute of Technology.
  </p>
  <p>
    My research centers on building <strong>open-ended generalist agents</strong>, including computer-use agents, embodied game agents, and MCP-based agents. My core interest lies in building and leveraging large pre-trained <strong>Foundation Models</strong> (LLMs, VLMs, VLA) to significantly enhance agent generalization capabilities. My research contributions fall into two main categories: 
    <ul>
      <li>
        <strong>Agentic Workflow</strong>: 
        <a href="https://arxiv.org/pdf/2302.01560.pdf" target="_blank">DEPS</a> (Planning Agent),
        <a href="https://craftjarvis.github.io/JARVIS-1/" target="_blank">JARVIS-1</a> (Self-improving Agent with Multimodal Memory),
        <a href="https://craftjarvis.github.io/RAT" target="_blank">RAT</a> (Open Deep Research Agent),
        <a href="https://craftjarvis.github.io/ROCKET-1" target="_blank">ROCKET-1</a> (Embodied Agent with GUI action space),
        <a href="https://pku-proagent.github.io/" target="_blank">ProAgent</a> (Collaborating LLM-based Game Agents).
      </li>
      <li>
        <strong>Agentic Foundation Models</strong>: 
        <a href="https://omnijarvis.github.io/" target="_blank">OmniJARVIS</a> (Hierarchical VLA with Latent Action Space),
        <a href="https://craftjarvis.github.io/JarvisVLA/" target="_blank">JARVIS-VLA</a> (Vision-Language-Action Model in Open World).
      </li>
    </ul>
  </p>

