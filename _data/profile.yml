short_bio_text_justify: false
short_bio: >-
  <p>
    I am a Ph.D. student in the Institute for Artificial Intelligence at Peking University (PKU), advised by <a href="https://scholar.google.com/citations?user=KVzR1XEAAAAJ" target="_blank">Prof. Yitao Liang</a>. Before joining PKU, I received my MSc and BA degrees in Control Science and Technology from Beijing Institute of Technology. I work on building open-ended embodied agents with multi-task skills in 3d games, including visual localization, task planning, and decision-making. In particular, I am interested in building and leveraging large pre-trained Foundation Models to improve the generalization of agent capabilities.
  </p>
  <p>
    Recently, we have developed a series of open-world multi-task agents, including OmniJARVIS (pretrained hierarchical Vision-Language-Action models with self-supervised quantified tokenizer and latent space), JARVIS-1 (self-improving agent with multimodal memory), DEPS (interactive long-horizon planning agent), RAT (open deep research agent), GROOT (self-supervised latent space multi-task policy), and ProAgent (collaborating llm-based game agents).
  </p>

